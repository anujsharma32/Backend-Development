
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 08 - To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f4f7fb;
        }

        .app {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0001;
        }

        input {
            padding: 10px;
            width: 65%;
            box-sizing: border-box;
        }

        button {
            padding: 10px 14px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        li span {
            cursor: pointer;
            overflow-wrap: anywhere;
        }

        .done {
            text-decoration: line-through;
            color: gray;
        }

        .delete-btn {
            background: #dc2626;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>My To-Do List</h1>

        <input
            type="text"
            id="taskInput"
            placeholder="Enter a task..."
        >
        <button id="addBtn">Add</button>

        <ul id="taskList"></ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
